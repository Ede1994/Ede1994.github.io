<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Eric Einspänner — Medical physicist, clinical AI researcher, and developer."
    />
    <title>Eric Einspänner</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=IBM+Plex+Sans:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <div class="grain" aria-hidden="true"></div>
    <canvas id="particles" aria-hidden="true"></canvas>

    <header class="site-header">
      <button
        id="theme-toggle"
        class="theme-toggle"
        type="button"
        aria-label="Toggle dark mode"
      >
        <span class="theme-icon theme-icon--sun" aria-hidden="true">☀</span>
        <span class="theme-icon theme-icon--moon" aria-hidden="true">☾</span>
      </button>
    </header>

    <main class="container">
      <section class="hero">
        <p class="hero-kicker">Hello, I'm</p>
        <h1 class="hero-name" id="site-name">Eric Einspänner</h1>
        <p class="hero-tagline" id="site-tagline">
          Medical physicist · Clinical AI · Neuroimaging
        </p>
        <p class="hero-typing">
          <span id="typing-text"></span
          ><span class="typing-cursor" aria-hidden="true">|</span>
        </p>
        <div class="hero-meta">
          <span id="local-time" class="meta-chip">--:--</span>
          <span id="site-location" class="meta-chip">Magdeburg, Germany</span>
        </div>
      </section>

      <section class="links" aria-label="Links">
        <h2 class="section-title">Connect</h2>
        <nav class="link-grid" id="link-grid"></nav>
      </section>

      <section class="map-section" aria-label="Countries visited">
        <div class="map-header">
          <div>
            <h2 class="section-title">Places I've been</h2>
            <p class="map-subtitle">
              Hover a highlighted country ·
              <span id="country-count" class="country-count">0</span> countries
              so far
            </p>
          </div>
          <p id="map-tooltip" class="map-tooltip" aria-live="polite"></p>
        </div>
        <div class="map-wrap">
          <svg id="world-map" viewBox="0 0 960 520" role="img">
            <title>Interactive map of countries visited</title>
          </svg>
          <div class="map-legend">
            <span class="legend-item"
              ><span class="legend-swatch legend-swatch--visited"></span> Visited</span
            >
            <span class="legend-item"
              ><span class="legend-swatch legend-swatch--other"></span> Not yet</span
            >
          </div>
        </div>
      </section>
    </main>

    <footer class="site-footer">
      <p>
        Built with curiosity ·
        <a href="https://pages.github.com/" target="_blank" rel="noopener"
          >GitHub Pages</a
        >
      </p>
    </footer>

    <script src="js/config.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/d3@7"></script>
    <script src="https://cdn.jsdelivr.net/npm/topojson-client@3"></script>
    <script src="js/main.js"></script>
    <script src="js/map.js"></script>
  </body>
</html>
